<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAROSA OYUN | 3D Tactical FPS</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background: #08090c;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        #game-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
            transition: transform 0.05s ease, background-color 0.1s ease;
        }

        #crosshair::before, #crosshair::after {
            content: '';
            position: absolute;
            background: rgba(0, 255, 200, 0.8);
            transition: background 0.1s ease;
        }

        #crosshair::before {
            top: 4px; left: -10px; width: 30px; height: 2px;
        }

        #crosshair::after {
            top: -10px; left: 4px; width: 2px; height: 30px;
        }

        #crosshair.hit::before, #crosshair.hit::after {
            background: #ff0033 !important;
            box-shadow: 0 0 8px #ff0033;
        }

        #kill-feed {
            position: absolute;
            top: 25%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 28px;
            font-weight: 900;
            color: #ff3333;
            text-shadow: 0 0 15px rgba(255, 51, 51, 0.9);
            opacity: 0;
            transition: opacity 0.2s ease, transform 0.2s ease;
            pointer-events: none;
            z-index: 12;
            letter-spacing: 2px;
        }

        #damage-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0.35);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease-out;
            z-index: 9;
        }

        #hud {
            position: absolute;
            bottom: 30px;
            left: 40px;
            display: flex;
            gap: 30px;
            font-size: 24px;
            font-weight: 900;
            letter-spacing: 1px;
            background: rgba(10, 12, 18, 0.85);
            padding: 15px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 50, 50, 0.4);
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            pointer-events: none;
            z-index: 10;
        }

        .hud-val {
            color: #ff3333;
            text-shadow: 0 0 10px rgba(255, 51, 51, 0.6);
        }

        #reload-msg {
            position: absolute;
            top: 60%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.8);
            display: none;
            pointer-events: none;
            z-index: 11;
        }

        #blocker {
            position: absolute;
            width: 100%;
            height: 100%;
            background-color: rgba(5, 6, 10, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        #instructions {
            text-align: center;
            color: #ffffff;
            cursor: pointer;
        }

        #instructions h1 {
            font-size: 52px;
            color: #ff2a2a;
            letter-spacing: 3px;
            text-shadow: 0 0 25px rgba(255, 42, 42, 0.8);
            margin-bottom: 15px;
        }

        #instructions p {
            font-size: 18px;
            color: #cccccc;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .btn-start {
            padding: 16px 45px;
            background: linear-gradient(135deg, #ff1a1a, #800000);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(255, 26, 26, 0.6);
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        #visitor-counter {
            position: fixed;
            bottom: 15px;
            right: 15px;
            z-index: 99999;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 12px;
            border-radius: 8px;
            color: white;
            font-family: sans-serif;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="game-container">
        <div id="crosshair"></div>
        <div id="kill-feed">DÜŞMAN ETKİSİZ HALE GETİRİLDİ!</div>
        <div id="damage-flash"></div>
        <div id="reload-msg">YENİDEN DOLDURULUYOR...</div>

        <div id="hud">
            <div>SKOR: <span id="score" class="hud-val">0</span></div>
            <div>MERMİ: <span id="ammo" class="hud-val">30 / 30</span></div>
            <div>CAN: <span id="health" class="hud-val">100</span></div>
        </div>

        <div id="blocker">
            <div id="instructions">
                <h1 id="screen-title">BAROSA 3D ARENA</h1>
                <p id="screen-desc">Taktiksel Askeri Üsse Hoş Geldin!<br>Oynamak ve nişan almak için ekrana tıkla!<br><br>
                <b>W, A, S, D</b> — Hareket Et<br>
                <b>FARE SOL TIK</b> — Ateş Et<br>
                <b>R</b> — Şarjör Yenile (2sn)<br>
                <b>SPACE</b> — Zıpla</p>
                <button class="btn-start" id="start-btn">SAVAŞA KATIL</button>
            </div>
        </div>

        <div id="visitor-counter">
            <span>Ziyaretçi:</span>
            <img src="https://hits.seeyoufarm.com/api/count/incr/badge.svg?url=https%3A%2F%2Fbarosa9.github.io%2Fbarosa-oyun&count_bg=%2300E676&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=TOPLAM&edge_flat=false" alt="Ziyaretçi" />
        </div>
    </div>

    <script>
        let scene, camera, renderer;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let prevTime = performance.now();
        const velocity = new THREE.Vector3();
        const direction = new THREE.Vector3();

        let score = 0;
        let ammo = 30;
        const maxAmmo = 30;
        let health = 100;
        const maxHealth = 100;
        let isLocked = false;
        let isReloading = false;
        const reloadTime = 2000;

        let lastShootTime = 0;
        const shootCooldown = 120;

        let weaponGroup, muzzleFlash;
        let enemies = [];
        let bloodParticles = [];
        let obstacles = [];
        let bulletPool = [];
        const maxPoolSize = 20;

        const playerRadius = 0.6;

        const hudScore = document.getElementById('score');
        const hudAmmo = document.getElementById('ammo');
        const hudHealth = document.getElementById('health');
        const reloadMsg = document.getElementById('reload-msg');
        const damageFlash = document.getElementById('damage-flash');
        const crosshair = document.getElementById('crosshair');
        const killFeed = document.getElementById('kill-feed');
        const blocker = document.getElementById('blocker');
        const screenTitle = document.getElementById('screen-title');
        const screenDesc = document.getElementById('screen-desc');
        const startBtn = document.getElementById('start-btn');

        init();
        animate();

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x050608);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 0);
            scene.add(camera);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
            dirLight.position.set(30, 50, 30);
            scene.add(dirLight);

            // Gelişmiş Zemin (Grid / Izgara Görünümlü Taktiksel Zemin)
            const floorGeo = new THREE.PlaneGeometry(120, 120);
            const floorMat = new THREE.MeshBasicMaterial({ color: 0x161a23 });
            const floor = new THREE.Mesh(floorGeo, floorMat);
            floor.rotation.x = -Math.PI / 2;
            scene.add(floor);

            // Zemin Izgara Çizgileri
            const gridHelper = new THREE.GridHelper(120, 30, 0xff2a2a, 0x2a3040);
            gridHelper.position.y = 0.01;
            scene.add(gridHelper);

            createMapBoundaries();
            createAdvancedTacticalMap();
            createWeapon();
            initBulletPool();

            renderer = new THREE.WebGLRenderer({ antialias: false });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            document.getElementById('game-container').appendChild(renderer.domElement);

            document.addEventListener('click', () => {
                if (!isLocked) {
                    if (health <= 0) resetGame();
                    document.body.requestPointerLock();
                } else {
                    shoot();
                }
            });

            document.addEventListener('pointerlockchange', () => {
                isLocked = (document.pointerLockElement === document.body);
                blocker.style.display = isLocked ? 'none' : 'flex';
            });

            document.addEventListener('mousemove', onMouseMove);
            document.addEventListener('keydown', onKeyDown);
            document.addEventListener('keyup', onKeyUp);
            window.addEventListener('resize', onWindowResize);

            for (let i = 0; i < 4; i++) {
                spawnEnemy();
            }
        }

        function initBulletPool() {
            const bulletGeo = new THREE.SphereGeometry(0.12, 4, 4);
            const bulletMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });

            for (let i = 0; i < maxPoolSize; i++) {
                const mesh = new THREE.Mesh(bulletGeo, bulletMat);
                mesh.visible = false;
                scene.add(mesh);

                bulletPool.push({
                    mesh: mesh,
                    active: false,
                    position: new THREE.Vector3(),
                    velocity: new THREE.Vector3(),
                    lifeTime: 0
                });
            }
        }

        function getBulletFromPool(pos, vel) {
            const bullet = bulletPool.find(b => !b.active);
            if (bullet) {
                bullet.active = true;
                bullet.mesh.visible = true;
                bullet.position.copy(pos);
                bullet.mesh.position.copy(pos);
                bullet.velocity.copy(vel);
                bullet.lifeTime = 0;
            }
            return bullet;
        }

        function spawnBloodEffect(position) {
            const particleCount = 12;
            const pGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);
            const pMat = new THREE.MeshBasicMaterial({ color: 0xbb0000 });

            for (let i = 0; i < particleCount; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(position);
                scene.add(p);

                const vel = new THREE.Vector3(
                    (Math.random() - 0.5) * 4,
                    Math.random() * 3 + 1,
                    (Math.random() - 0.5) * 4
                );

                bloodParticles.push({ mesh: p, velocity: vel, life: 0.4 });
            }
        }

        function createMapBoundaries() {
            const wallMat = new THREE.MeshBasicMaterial({ color: 0x11141c });
            const walls = [
                { w: 120, h: 12, d: 2, x: 0, y: 6, z: -60 },
                { w: 120, h: 12, d: 2, x: 0, y: 6, z: 60 },
                { w: 2, h: 12, d: 120, x: -60, y: 6, z: 0 },
                { w: 2, h: 12, d: 120, x: 60, y: 6, z: 0 }
            ];

            walls.forEach(w => {
                const wallGeo = new THREE.BoxGeometry(w.w, w.h, w.d);
                const wall = new THREE.Mesh(wallGeo, wallMat);
                wall.position.set(w.x, w.y, w.z);
                scene.add(wall);
                obstacles.push(new THREE.Box3().setFromObject(wall));
            });
        }

        // --- TAKTİKSEL ARENA VE BİNALAR ---
        function createAdvancedTacticalMap() {
            const concreteMat = new THREE.MeshBasicMaterial({ color: 0x2b313f });
            const metalMat = new THREE.MeshBasicMaterial({ color: 0x1e222b });
            const hazardMat = new THREE.MeshBasicMaterial({ color: 0x3d4454 });

            // 1. Merkezde Büyük Stratejik Ana Bina
            const centerBuildingGeo = new THREE.BoxGeometry(10, 5, 10);
            const centerBuilding = new THREE.Mesh(centerBuildingGeo, concreteMat);
            centerBuilding.position.set(0, 2.5, 0);
            scene.add(centerBuilding);
            obstacles.push(new THREE.Box3().setFromObject(centerBuilding));

            // 2. Çeşitli Siper Duvarları ve Konteyner Bloklar (Girilemeyen Katı Yapılar)
            const mapStructures = [
                { w: 6, h: 3, d: 2, x: -15, z: -15, mat: hazardMat },
                { w: 6, h: 3, d: 2, x: 15, z: 15, mat: hazardMat },
                { w: 2, h: 3, d: 8, x: -25, z: 10, mat: metalMat },
                { w: 2, h: 3, d: 8, x: 25, z: -10, mat: metalMat },
                { w: 8, h: 4, d: 2, x: 0, z: -25, mat: concreteMat },
                { w: 8, h: 4, d: 2, x: 0, z: 25, mat: concreteMat },
                { w: 5, h: 3, d: 5, x: -30, z: -30, mat: hazardMat },
                { w: 5, h: 3, d: 5, x: 30, z: 30, mat: hazardMat }
            ];

            mapStructures.forEach(item => {
                const geo = new THREE.BoxGeometry(item.w, item.h, item.d);
                const mesh = new THREE.Mesh(geo, item.mat);
                mesh.position.set(item.x, item.h / 2, item.z);
                scene.add(mesh);
                obstacles.push(new THREE.Box3().setFromObject(mesh));
            });
        }

        function createWeapon() {
            weaponGroup = new THREE.Group();

            const bodyGeo = new THREE.BoxGeometry(0.16, 0.2, 0.7);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0x22252a });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            weaponGroup.add(body);

            const barrelGeo = new THREE.CylinderGeometry(0.04, 0.04, 0.5);
            const barrelMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const barrel = new THREE.Mesh(barrelGeo, barrelMat);
            barrel.rotation.x = Math.PI / 2;
            barrel.position.set(0, 0.03, -0.5);
            weaponGroup.add(barrel);

            const magGeo = new THREE.BoxGeometry(0.1, 0.3, 0.15);
            const magMat = new THREE.MeshBasicMaterial({ color: 0xaa2222 });
            const mag = new THREE.Mesh(magGeo, magMat);
            mag.position.set(0, -0.2, -0.1);
            weaponGroup.add(mag);

            const flashGeo = new THREE.SphereGeometry(0.09, 6, 6);
            const flashMat = new THREE.MeshBasicMaterial({ color: 0xffcc00, transparent: true, opacity: 0 });
            muzzleFlash = new THREE.Mesh(flashGeo, flashMat);
            muzzleFlash.position.set(0, 0.03, -0.8);
            weaponGroup.add(muzzleFlash);

            weaponGroup.position.set(0.35, -0.3, -0.65);
            camera.add(weaponGroup);
        }

        function triggerHitmarker() {
            crosshair.classList.add('hit');
            setTimeout(() => { crosshair.classList.remove('hit'); }, 150);
        }

        function triggerKillFeed() {
            killFeed.style.opacity = '1';
            killFeed.style.transform = 'translate(-50%, -60%)';
            setTimeout(() => {
                killFeed.style.opacity = '0';
                killFeed.style.transform = 'translate(-50%, -50%)';
            }, 800);
        }

        function shoot() {
            if (isReloading || !isLocked) return;

            const now = performance.now();
            if (now - lastShootTime < shootCooldown) return;
            lastShootTime = now;

            if (ammo <= 0) {
                reloadWeapon();
                return;
            }

            ammo--;
            hudAmmo.textContent = `${ammo} / ${maxAmmo}`;

            muzzleFlash.material.opacity = 1;
            setTimeout(() => { muzzleFlash.material.opacity = 0; }, 30);

            weaponGroup.position.z = -0.55;
            setTimeout(() => { weaponGroup.position.z = -0.65; }, 50);

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);

            const intersects = raycaster.intersectObjects(enemies.map(e => e.bodyMesh), true);

            const shootDir = new THREE.Vector3();
            camera.getWorldDirection(shootDir);
            const startPos = camera.position.clone().add(new THREE.Vector3(0, -0.1, 0));
            getBulletFromPool(startPos, shootDir.multiplyScalar(2.5));

            if (intersects.length > 0) {
                const hitPoint = intersects[0].point;
                let hitMesh = intersects[0].object;

                while (hitMesh.parent && hitMesh.parent.type === "Group") {
                    hitMesh = hitMesh.parent;
                }

                const enemyObj = enemies.find(e => e.mesh === hitMesh);
                if (enemyObj) {
                    triggerHitmarker();
                    spawnBloodEffect(hitPoint);
                    enemyObj.takeDamage(35);
                }
            }

            if (ammo === 0) {
                reloadWeapon();
            }
        }

        function reloadWeapon() {
            if (isReloading || ammo === maxAmmo) return;

            isReloading = true;
            reloadMsg.style.display = 'block';

            setTimeout(() => {
                ammo = maxAmmo;
                hudAmmo.textContent = `${ammo} / ${maxAmmo}`;
                isReloading = false;
                reloadMsg.style.display = 'none';
            }, reloadTime);
        }

        function playerTakeDamage(amount) {
            if (health <= 0) return;
            health -= amount;
            if (health < 0) health = 0;
            hudHealth.textContent = health;

            damageFlash.style.opacity = '1';
            setTimeout(() => { damageFlash.style.opacity = '0'; }, 150);

            if (health <= 0) gameOver();
        }

        function gameOver() {
            document.exitPointerLock();
            screenTitle.textContent = "GÖREV BAŞARISIZ";
            screenDesc.innerHTML = `Düşmanlar tarafından etkisiz hale getirildin.<br>Toplanan Skor: <b>${score}</b>`;
            startBtn.textContent = "Yeniden Dene";
            blocker.style.display = 'flex';
        }

        function resetGame() {
            health = maxHealth;
            score = 0;
            ammo = maxAmmo;
            hudHealth.textContent = health;
            hudScore.textContent = score;
            hudAmmo.textContent = `${ammo} / ${maxAmmo}`;

            enemies.forEach(e => scene.remove(e.mesh));
            enemies = [];
            for (let i = 0; i < 4; i++) {
                spawnEnemy();
            }
            camera.position.set(0, 1.7, 0);
        }

        function spawnEnemy() {
            const enemyGroup = new THREE.Group();

            const bodyGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.6, 6);
            const bodyMat = new THREE.MeshBasicMaterial({ color: 0xcc2222 });
            const body = new THREE.Mesh(bodyGeo, bodyMat);
            body.position.y = 0.8;
            enemyGroup.add(body);

            let spawnX, spawnZ;
            do {
                spawnX = (Math.random() - 0.5) * 80;
                spawnZ = (Math.random() - 0.5) * 80;
            } while (Math.abs(spawnX) < 10 && Math.abs(spawnZ) < 10); // Başlangıç noktasına çok yakın doğmasınlar

            enemyGroup.position.set(spawnX, 0, spawnZ);
            scene.add(enemyGroup);

            const enemyObj = {
                mesh: enemyGroup,
                bodyMesh: body,
                material: bodyMat,
                health: 100,
                lastAttackTime: 0,
                takeDamage: function(damage) {
                    this.health -= damage;
                    
                    this.material.color.setHex(0xffffff);
                    setTimeout(() => { this.material.color.setHex(0xcc2222); }, 80);

                    if (this.health <= 0) {
                        triggerKillFeed();
                        scene.remove(this.mesh);
                        enemies = enemies.filter(e => e !== this);
                        score += 100;
                        hudScore.textContent = score;
                        spawnEnemy();
                    }
                }
            };

            enemies.push(enemyObj);
        }

        let yaw = 0, pitch = 0;
        function onMouseMove(event) {
            if (!isLocked) return;

            yaw -= event.movementX * 0.002;
            pitch -= event.movementY * 0.002;
            pitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, pitch));

            camera.rotation.order = "YXZ";
            camera.rotation.y = yaw;
            camera.rotation.x = pitch;
        }

        function onKeyDown(event) {
            switch (event.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 10; canJump = false; break;
                case 'KeyR': reloadWeapon(); break;
            }
        }

        function onKeyUp(event) {
            switch (event.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyD': moveRight = false; break;
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function checkCollisions(newPosition) {
            const playerBox = new THREE.Box3(
                new THREE.Vector3(newPosition.x - playerRadius, 0, newPosition.z - playerRadius),
                new THREE.Vector3(newPosition.x + playerRadius, 2.0, newPosition.z + playerRadius)
            );

            for (let i = 0; i < obstacles.length; i++) {
                if (playerBox.intersectsBox(obstacles[i])) return true;
            }
            return false;
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);

            if (isLocked && health > 0) {
                velocity.x -= velocity.x * 10.0 * delta;
                velocity.z -= velocity.z * 10.0 * delta;
                velocity.y -= 9.8 * 2.5 * delta;

                direction.z = Number(moveForward) - Number(moveBackward);
                direction.x = Number(moveRight) - Number(moveLeft);
                direction.normalize();

                if (moveForward || moveBackward) velocity.z -= direction.z * 120.0 * delta;
                if (moveLeft || moveRight) velocity.x -= direction.x * 120.0 * delta;

                const moveX = -velocity.x * delta;
                const moveZ = velocity.z * delta;
                const currentPos = camera.position.clone();

                camera.translateX(moveX);
                if (checkCollisions(camera.position)) camera.position.x = currentPos.x;

                camera.translateZ(moveZ);
                if (checkCollisions(camera.position)) camera.position.z = currentPos.z;

                camera.position.y += velocity.y * delta;
                if (camera.position.y < 1.7) {
                    velocity.y = 0;
                    camera.position.y = 1.7;
                    canJump = true;
                }

                bulletPool.forEach(bullet => {
                    if (bullet.active) {
                        bullet.position.addScaledVector(bullet.velocity, delta * 60);
                        bullet.mesh.position.copy(bullet.position);
                        bullet.lifeTime += delta;

                        if (bullet.lifeTime > 2.0 || Math.abs(bullet.position.x) > 58 || Math.abs(bullet.position.z) > 58) {
                            bullet.active = false;
                            bullet.mesh.visible = false;
                        }
                    }
                });

                for (let i = bloodParticles.length - 1; i >= 0; i--) {
                    const p = bloodParticles[i];
                    p.mesh.position.addScaledVector(p.velocity, delta);
                    p.velocity.y -= 9.8 * delta;
                    p.life -= delta;

                    if (p.life <= 0) {
                        scene.remove(p.mesh);
                        bloodParticles.splice(i, 1);
                    }
                }

                const now = performance.now();
                enemies.forEach(e => {
                    e.mesh.lookAt(camera.position.x, e.mesh.position.y, camera.position.z);
                    const distToPlayer = e.mesh.position.distanceTo(camera.position);

                    if (distToPlayer > 2.2) {
                        e.mesh.translateZ(0.035);
                    } else {
                        if (now - e.lastAttackTime > 1200) {
                            playerTakeDamage(15);
                            e.lastAttackTime = now;
                        }
                    }
                });
            }

            prevTime = time;
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
